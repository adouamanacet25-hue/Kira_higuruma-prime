<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purge de Higuruma Kira</title>
    <style>
        /* --- Reset et Thème Sombre Rouge --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #110000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-image: url('bg-image.jpg'); /* Votre image de fond */
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(70, 0, 0, 0.85);
            z-index: 0;
        }

        /* --- Conteneur Principal --- */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(20, 0, 0, 0.75);
            border: 1px solid #aa0000;
            border-radius: 16px;
            padding: 25px 30px 20px;
            width: 92%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(150, 0, 0, 0.4);
            text-align: center;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Titre Épuré avec Animation --- */
        .header-title { margin-bottom: 18px; position: relative; }
        .title-main {
            font-size: 22px; font-weight: 600; letter-spacing: 4px; color: #ffcccc;
            text-transform: uppercase; animation: textGlow 2.5s infinite ease-in-out;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .title-symbol { font-size: 26px; color: #cc0000; display: inline-block; }
        .title-sub { font-size: 12px; font-weight: 300; color: #aa5555; letter-spacing: 6px; margin-top: -4px; }
        @keyframes textGlow {
            0% { text-shadow: 0 0 5px rgba(255, 0, 0, 0.3); }
            50% { text-shadow: 0 0 15px rgba(255, 0, 0, 0.7); }
            100% { text-shadow: 0 0 5px rgba(255, 0, 0, 0.3); }
        }

        /* --- Formulaire Numéro --- */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 12px; letter-spacing: 1px; color: #bb6666; }
        .input-group input {
            width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid #990000;
            background: #1f0000; color: #ffffff; font-size: 15px; outline: none; letter-spacing: 1px;
        }
        .input-group input:focus { border-color: #ff0000; box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); }

        /* --- Boutons Ban / Unban --- */
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button.btn-action {
            flex: 1; padding: 10px 0; border: none; border-radius: 6px;
            font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; text-transform: uppercase;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-ban { background: #990000; color: white; box-shadow: 0 0 12px rgba(255, 0, 0, 0.3); }
        .btn-ban:hover { background: #cc0000; transform: scale(1.02); }
        .btn-unban { background: #1f0000; color: #aa5555; border: 1px solid #660000; }
        .btn-unban:hover { background: #330000; color: white; }

        /* --- Ajout d'image + Lien Fake Chat --- */
        .media-actions {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-bottom: 20px; padding-top: 12px; border-top: 1px solid #330000;
        }
        .img-select-btn {
            background: #2a0000; border: 1px solid #660000; color: #cc6666;
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .img-select-btn:hover { background: #3a0000; border-color: #aa0000; }
        #imagePreview {
            width: 40px; height: 40px; border-radius: 6px; border: 1px solid #aa0000;
            object-fit: cover; display: none; background: #000;
        }
        .btn-fake-chat {
            flex: 1; background: #660000; color: #ffcccc; border: none; padding: 8px 0;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; display: flex; justify-content: center; gap: 6px;
            transition: 0.2s; text-decoration: none;
        }
        .btn-fake-chat:hover { background: #880000; transform: scale(1.02); }

        /* --- Scroll View Témoignages --- */
        .testimonials-wrapper {
            margin-top: 5px; border-top: 1px solid #330000; padding-top: 12px;
        }
        .testimonials-title { font-size: 12px; color: #aa5555; letter-spacing: 2px; margin-bottom: 8px; }
        .scroll-container {
            height: 140px; overflow-y: auto; padding-right: 5px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .scroll-container::-webkit-scrollbar { width: 6px; }
        .scroll-container::-webkit-scrollbar-track { background: #1a0000; border-radius: 10px; }
        .scroll-container::-webkit-scrollbar-thumb { background: #990000; border-radius: 10px; }
        
        .testimonial-card {
            display: flex; align-items: center; gap: 15px;
            background: rgba(30, 0, 0, 0.8); border: 1px solid #440000; border-radius: 8px;
            padding: 8px 12px; transition: 0.2s;
        }
        .testimonial-card:hover { border-color: #880000; }
        .testimonial-card img {
            width: 50px; height: 50px; border-radius: 6px; border: 1px solid #660000; object-fit: cover;
        }
        .testimonial-info { flex: 1; text-align: left; }
        .testimonial-phone { font-size: 15px; font-weight: 600; color: #ffcccc; letter-spacing: 1px; }

        /* --- Menu (3 points) et Modale --- */
        .menu-wrapper { position: absolute; top: 12px; right: 15px; }
        .menu-btn {
            background: rgba(50, 0, 0, 0.5); border: 1px solid #660000; color: #aa5555;
            font-size: 18px; width: 32px; height: 32px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .menu-btn:hover { background: rgba(150, 0, 0, 0.5); color: #ffcccc; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 0, 0, 0.9); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; opacity: 0; transition: opacity 0.3s ease;
        }
        #modal-overlay.active { display: flex; opacity: 1; }
        .modal-box {
            background: #140000; border: 1px solid #aa0000; border-radius: 12px;
            width: 85%; max-width: 350px; padding: 30px 25px; position: relative; text-align: center;
        }
        .modal-box h2 { color: #ff5555; font-size: 18px; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #330000; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-box p { color: #ddcccc; font-size: 14px; line-height: 1.6; text-align: left; white-space: pre-line; }
        .modal-close {
            position: absolute; top: -12px; right: -12px; background: #660000; border: 2px solid #aa0000;
            color: white; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer;
        }
        .modal-close:hover { background: #aa0000; transform: scale(1.1); }

        /* --- Footer --- */
        .footer { margin-top: 12px; font-size: 11px; color: #551111; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Menu à trois points ☰ -->
        <div class="menu-wrapper">
            <button class="menu-btn" onclick="openModal('menu')">☰</button>
        </div>

        <!-- Titre -->
        <div class="header-title">
            <div class="title-main">
                <span class="title-symbol">⚖</span> PURGE <span class="title-symbol">⚖</span>
            </div>
            <div class="title-sub">DE HIGURUMA KIRA</div>
        </div>

        <!-- Formulaire -->
        <div class="input-group">
            <label>NUMERO DE LA CIBLE</label>
            <input type="tel" id="phoneNumber" placeholder="Ex: +242061234567">
        </div>

        <!-- Boutons Ban / Unban -->
        <div class="btn-group">
            <button class="btn-action btn-ban" onclick="handleAction('ban')">BAN ✖</button>
            <button class="btn-action btn-unban" onclick="handleAction('unban')">UNBAN ✓</button>
        </div>

        <!-- Section Image + Fake Chat -->
        <div class="media-actions">
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImage(event)">
            <button class="img-select-btn" onclick="document.getElementById('fileInput').click()">📎 add fake chat</button>
            <img id="imagePreview" alt="Aperçu">
            <button class="btn-fake-chat" onclick="window.open('https://github.com/adouamanacet25-hue/Fake-chat-by-lord-Kira', '_blank')">
                use a fake chat
            </button>
        </div>

        <!-- Section Scroll View Témoignages -->
        <div class="testimonials-wrapper">
            <div class="testimonials-title">⚖ TÉMOIGNAGES ⚖</div>
            <div class="scroll-container">
                
                <!-- Carte Témoignage 1 -->
                <div class="testimonial-card">
                    <img src="https://i.ibb.co/6jK1pqg/E1-E4-FD14-0-DFB-4-E57-90-EA-5-F727-E49-AF2-B.jpg" alt="Témoin 1">
                    <div class="testimonial-info">
                        <div class="testimonial-phone">+221 786614801 📵 off</div>
                    </div>
                </div>

                <!-- Carte Témoignage 2 -->
                <div class="testimonial-card">
                    <img src="https://i.ibb.co/SD4Lv2n4/C11-D8-DA8-3621-446-A-8-D97-68-BD1-E89-B445.png" alt="Témoin 2">
                    <div class="testimonial-info">
                        <div class="testimonial-phone">+237 682230476 📵 off </div>
                    </div>
                </div>

                <!-- Carte Témoignage 3 -->
                <div class="testimonial-card">
                    <img src="https://i.ibb.co/2YdhQNF0/3-E2-AC3-CE-D4-D1-4-F12-A385-6-C7-B4-B361-F2-C.jpg" alt="Témoin 3">
                    <div class="testimonial-info">
                        <div class="testimonial-phone">+241 60249486 📵 off</div>
                    </div>
                </div>

            </div>
        </div>

        <div class="footer">
signale un peu pour qu'il soit ban plus vite </div>
    </div>

    <!-- Modale (Semi-page) -->
    <div id="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal-box" id="modalContent">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2 id="modalTitle">Titre</h2>
            <p id="modalText">Contenu de la fenêtre.</p>
        </div>
    </div>

    <script>
        // --- Gestion de la Modale (Semi-page) ---
        const overlay = document.getElementById('modal-overlay');
        const titleEl = document.getElementById('modalTitle');
        const textEl = document.getElementById('modalText');

        const menuData = {
            'aide': { title: 'AIDE', text: '1. Saisissez un numéro valide.\n2. Cliquez sur "BAN ✖" ou "UNBAN ✓".\n3. Une conversation avec support WhatsApp s\'ouvrira automatiquement avec le message correspondant.' },
            'propos': { title: 'À PROPOS', text: 'Version : v1.0\nInterface de jugement sombre et purifiante.\nRéalisée avec des symboles de justice.' },
            'createur': { title: 'CRÉATEUR', text: 'Lord Kira Higuruma.\nL\'épée de la justice, la balance de la vérité.' },
            'contact': { title: 'NOUS CONTACTER', text: 'Support technique disponible sur WhatsApp au :\n+242 06 721 02 67\n\nCliquez sur le lien WhatsApp ci-dessous pour nous écrire directement.' },
            'menu': { title: 'MENU JUGEMENT', text: 'Choisissez une option :\n\n1. Aide (Comment utiliser)\n2. À propos (v1.0)\n3. Créateur (Lord Kira)\n4. Nous contacter (WhatsApp)' }
        };

        function openModal(section) {
            const data = menuData[section];
            if(data) {
                titleEl.textContent = data.title;
                textEl.innerHTML = data.text.replace(/\n/g, '<br>');
                overlay.classList.add('active');
            }
        }

        function closeModal() { overlay.classList.remove('active'); }
        function closeModalOutside(e) { if (e.target === overlay) closeModal(); }

        // Navigation dans la modale (menu interne)
        document.addEventListener('click', function(e) {
            if(e.target.tagName === 'A' && e.target.closest('#modalContent')) {
                e.preventDefault();
                const text = e.target.textContent.toLowerCase();
                if(text.includes('aide')) openModal('aide');
                else if(text.includes('propos')) openModal('propos');
                else if(text.includes('createur')) openModal('createur');
                else if(text.includes('contacter')) openModal('contact');
            }
        });

        // --- Gestion Image (Galerie) ---
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgPreview = document.getElementById('imagePreview');
                    imgPreview.src = e.target.result;
                    imgPreview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // --- Gestion WhatsApp (Ban / Unban) ---
        function handleAction(action) {
            const phoneInput = document.getElementById('phoneNumber').value.trim();
            const phoneRegex = /^\+?[0-9]{8,15}$/;

            if (!phoneInput || !phoneRegex.test(phoneInput)) {
                openModal('aide');
                return;
            }

            let message = "";
            if (action === 'ban') message = `ce numéro ${phoneInput} est un mauvais utilisateur`;
            else if (action === 'unban') message = `ce numéro ${phoneInput} est un bon utilisateur`;

            const encodedMessage = encodeURIComponent(message);
            const supportPhone = "242067210267"; 
            const url = `https://wa.me/${supportPhone}?text=${encodedMessage}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
